name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: sudo --preserve-env=CI bash tests/test_install.sh target/debug
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bash tests/test_release_tag.sh

  gui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libudev-dev
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyQt6
      - run: cargo build --locked --bin edgemap
      - run: python -m unittest discover -s tests -p 'test_gui.py' -v
