name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  gui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libudev-dev
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyQt6
      - run: cargo build --locked --bin edgemap
      - run: python -m unittest discover -s tests -p 'test_gui.py' -v

  release:
    needs: gui
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: bash scripts/verify_release_tag.sh "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: sudo --preserve-env=CI bash tests/test_install.sh target/release

      - name: Package tarball
        run: |
          TAG=${GITHUB_REF_NAME}
          DIR="edgemap-${TAG}-x86_64"
          scripts/stage_release.sh "${DIR}" target/release
          tar -czf "${DIR}.tar.gz" "${DIR}/"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: edgemap-*.tar.gz
